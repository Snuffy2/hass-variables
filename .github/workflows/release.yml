name: Update Version and Create Zip on Release

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  update_version_and_create_zip:
    name: Update Version and Create Zip on Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # Use the release branch when available so git-auto-commit can push
          # back cleanly; otherwise keep the workflow's triggering ref.
          ref: ${{ github.event_name == 'release' && github.event.release.target_commitish || github.ref }}

      - name: Update integration version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          tag = os.environ["RELEASE_TAG"]

          manifest_path = Path("custom_components/variable/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          manifest["version"] = tag
          manifest_path.write_text(json.dumps(manifest, indent=4) + "\n")

          const_path = Path("custom_components/variable/const.py")
          const = const_path.read_text()
          const, replacements = re.subn(
              r'^VERSION = ".*"$',
              f'VERSION = "{tag}"',
              const,
              count=1,
              flags=re.MULTILINE,
          )
          if replacements != 1:
              raise RuntimeError("Unable to update VERSION in const.py")
          const_path.write_text(const)
          PY

      - name: Commit & Push Version Changes
        if: github.event_name == 'release' && github.event.release.prerelease == false
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: ${{ github.event.release.target_commitish }}
          commit_message: 'Updating to version ${{ github.event.release.tag_name }} [skip ci]'

      - name: Update Release with Version Changes Commit
        if: github.event_name == 'release' && github.event.release.prerelease == false
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git tag -f "$RELEASE_TAG"
          git push --force origin "$RELEASE_TAG"

      - name: Create Zip
        working-directory: custom_components/variable
        run: zip "$GITHUB_WORKSPACE/variable.zip" -r ./

      - name: Upload Zip to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: variable.zip
          tag_name: ${{ github.event.release.tag_name }}

      - name: Add Zip to Action
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: variable
          path: variable.zip
          if-no-files-found: error

name: Update Version and Create Zip on Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions: {}

jobs:
  manual-zip:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create Zip
        working-directory: custom_components/variable
        run: zip "$GITHUB_WORKSPACE/variable.zip" -r ./

      - name: Add Zip to Action
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: variable
          path: variable.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.target_commitish }}
          persist-credentials: false

      - name: Update integration version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python .github/scripts/update_version.py

      - name: Create Zip
        working-directory: custom_components/variable
        run: zip "$GITHUB_WORKSPACE/variable.zip" -r ./

      - name: Upload Zip to Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$GITHUB_WORKSPACE/variable.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Commit and push version changes
        id: version_commit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TARGET_BRANCH: ${{ github.event.release.target_commitish }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            custom_components/variable/manifest.json \
            custom_components/variable/const.py

          if git diff --cached --quiet; then
            echo "No version changes to commit."
            exit 0
          fi

          git commit -m "Updating to version ${RELEASE_TAG} [skip ci]"

          gh auth setup-git
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Update release tag
        if: steps.version_commit.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh auth setup-git
          git tag -f "$RELEASE_TAG"
          git push --force origin "refs/tags/${RELEASE_TAG}"

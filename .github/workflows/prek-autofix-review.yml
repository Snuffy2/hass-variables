name: prek-autofix

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: prek-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout prek-autofix collector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Snuffy2/prek-autofix
          ref: ce7466280e089e648ab0ed5b5fca2095bd1e78b1 # v1 / 1.0.7
          fetch-depth: 1
          persist-credentials: false

      - name: Stage collector outside the workspace
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/prek-autofix"
          cp -a dist/collect "$RUNNER_TEMP/prek-autofix/collect"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - id: install
        uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2
        with:
          install-only: "true"
          cache: "true"
          prek-version: "0.4.14"

      - id: review
        continue-on-error: true
        shell: bash
        env:
          PREK_AUTOFIX_EXTRA_ARGS: --all-files
          PREK_AUTOFIX_WORKING_DIRECTORY: .
          PREK_AUTOFIX_MAX_PASSES: "3"
          PREK_AUTOFIX_MAX_LOG_BYTES: "1048576"
          PREK_AUTOFIX_MAX_FILES: "100"
          PREK_AUTOFIX_MAX_BYTES: "10485760"
          PREK_AUTOFIX_PASS_TIMEOUT_SECONDS: "600"
        run: node "$RUNNER_TEMP/prek-autofix/collect/index.js"

      - id: upload
        name: Upload prek fixes
        if: steps.review.outputs.artifact-name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.review.outputs.artifact-name }}
          path: ${{ steps.review.outputs.artifact-path }}
          if-no-files-found: error

      - id: propagate
        name: Propagate collection failure
        if: steps.review.outcome == 'failure'
        shell: bash
        run: exit 1


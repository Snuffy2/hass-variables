name: pytest check and post coverage

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    name: pytest check and post coverage

    if: >
      !(
        github.event_name == 'pull_request' &&
        (
          contains(github.event.pull_request.labels.*.name, 'dependencies') ||
          github.event.pull_request.user.type == 'Bot'
        )
      )

    runs-on: ubuntu-latest

    permissions:
      # Fork pull request tokens are downgraded to read-only by GitHub.
      pull-requests: write
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pytest requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group pytest -e .

      - name: Run pytest with coverage
        run: python -m pytest

      - name: Generate PR coverage comment
        if: github.event_name == 'pull_request'
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v4.3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVITY: process_pr
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 70

      - name: Store PR coverage comment
        if: >
          github.event_name == 'pull_request' &&
          steps.coverage_comment.outputs.comment_file_written == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
          retention-days: 1

      - name: Store coverage database
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-data
          path: .coverage
          include-hidden-files: true
          retention-days: 1

  publish-coverage:
    name: Publish coverage data
    if: github.event_name == 'push'
    needs: tests

    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download coverage database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name coverage-data \
            --dir .

      - name: Publish coverage data
        uses: py-cov-action/python-coverage-comment-action@v4.3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVITY: save_coverage_data_files
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 70

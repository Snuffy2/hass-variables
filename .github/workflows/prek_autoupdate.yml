name: prek Autoupdate

on:
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch:

permissions: {}

concurrency:
  group: prek-autoupdate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install prek
        run: python -m pip install "prek==0.4.14"

      - name: Update prek hooks
        run: prek auto-update

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No prek updates."
            exit 0
          fi

          branch="automation/prek-autoupdate"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -C "$branch"
          git add -A
          git commit -m "chore: update prek hooks"

          gh auth setup-git

          git fetch origin "$branch" || true
          git push --force-with-lease origin "$branch"

          pr_number="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -z "$pr_number" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "chore: update prek hooks" \
              --body "Automated update generated by \`prek auto-update\`."
          fi

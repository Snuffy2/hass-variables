name: Post coverage Comment to PR

on:
  workflow_run:
    workflows: ["pytest and coverage"]
    types: [completed]

permissions: {}

jobs:
  comment:
    name: Post coverage Comment to PR
    runs-on: ubuntu-latest

    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'

    permissions:
      actions: read
      pull-requests: write

    steps:
      - name: Download coverage comment
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -eu

          mkdir -p coverage-comment

          if ! gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name python-coverage-comment-action \
            --dir coverage-comment; then
            echo "No coverage comment artifact. Nothing to post."
            exit 0
          fi

      - name: Create or update coverage comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        shell: bash
        run: |
          set -eu

          if [ -z "${PR_NUMBER:-}" ]; then
            echo "No pull request associated with this workflow run."
            exit 0
          fi

          comment_file="coverage-comment/python-coverage-comment-action.txt"

          if [ ! -s "$comment_file" ]; then
            echo "Coverage comment file does not exist."
            exit 0
          fi

          comment_id="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq '.[] |
                select(
                  .user.login == "github-actions[bot]" and
                  (.body | startswith("<!-- This comment was produced by python-coverage-comment-action"))
                ) |
                .id' |
            sed -n '1p'
          )"

          if [ -n "$comment_id" ]; then
            jq -n --rawfile body "$comment_file" '{body: $body}' |
              gh api \
                --method PATCH \
                "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
                --input -
          else
            jq -n --rawfile body "$comment_file" '{body: $body}' |
              gh api \
                --method POST \
                "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                --input -
          fi
